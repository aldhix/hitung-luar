<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello, World!</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <!-- Biodata -->
     <p>Nama: John Doe</p>
     <p>Umur: 30 tahun</p>
     <p>Alamat: Jl. Contoh No. 123, Kota Contoh</p>
    <h2>Menghitung luas persegi panjang</h2>
    <label for="panjang">Panjang (m):</label>
    <input type="number" id="panjang" min="0" step="any" required>
    <label for="lebar">Lebar (m):</label>
    <input type="number" id="lebar" min="0" step="any" required>
    <button type="button" id="hitungLuas">Hitung luas</button>
    <p>Luas persegi panjang: <span id="luas">0</span> m²</p>
    <script src="script.js"></script>
</body>
</html>
